<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Linemap</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 16h24' stroke='%232457d6' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='16' r='4' fill='white' stroke='%2315181c' stroke-width='2.5'/%3E%3Ccircle cx='22' cy='16' r='4' fill='white' stroke='%2315181c' stroke-width='2.5'/%3E%3C/svg%3E" />
    <script>
      // Paint the right theme before React mounts so the shell never flashes.
      try {
        var t = localStorage.getItem('excalidraw-canvas-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
